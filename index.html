<!DOCTYPE html>
<html lang="en" data-app="med-surg-nursing-app">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#5B63E6" />
<meta name="application-name" content="Med-Surg Nursing App" />
<title>Med-Surg Nursing App | Plalinda Studio</title>
<style>
:root{
  --ink:#24324A;--muted:#718096;--bg:#F7F8FC;--surface:#FFFFFF;--surface2:#F0F3FA;--line:#E2E7F0;
  --indigo:#5B63E6;--indigo2:#3949C8;--lav:#A88BF6;--sky:#6CBDEB;--coral:#FF7D8C;--gold:#F6BE5A;--mint:#55C7A6;
  --danger:#E85D6A;--success:#35A97C;--shadow:0 16px 42px rgba(41,54,112,.10);--shadow2:0 8px 22px rgba(41,54,112,.08);
  --radius:22px;--radius-sm:15px;--accent:var(--indigo);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
body:before,body:after{content:"";position:fixed;z-index:-2;border-radius:50%;filter:blur(8px);pointer-events:none}
body:before{width:420px;height:420px;right:-160px;top:120px;background:radial-gradient(circle,rgba(168,139,246,.15),transparent 68%)}
body:after{width:480px;height:480px;left:-210px;bottom:-180px;background:radial-gradient(circle,rgba(108,189,235,.15),transparent 68%)}
button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.hidden{display:none!important}
body.dark{--ink:#EAF0F7;--muted:#9FB0C2;--bg:#101522;--surface:#171E2D;--surface2:#1D2637;--line:#2B3548;--shadow:0 18px 44px rgba(0,0,0,.28);--shadow2:0 8px 22px rgba(0,0,0,.22)}

/* top frame intentionally keeps the proven SBAR interaction pattern, but the visual system is new */
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:50;height:72px;padding:10px 24px;display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}.brand-orbit{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,var(--indigo),var(--lav));box-shadow:0 8px 20px rgba(91,99,230,.26);display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}.brand-orbit:before{content:"";width:23px;height:23px;border:2px solid rgba(255,255,255,.9);border-radius:50%;position:absolute}.brand-orbit:after{content:none!important}.brand-copy strong{display:block;font-size:15px;line-height:1.05}.brand-copy small{display:block;color:var(--muted);font-size:9px;text-transform:none;letter-spacing:.03em;margin-top:4px;font-weight:800}.pro-pill{display:inline-flex;margin-left:5px;background:#EFEAFF;color:#6446D7;border:1px solid #DCD1FF;font-size:9px;padding:2px 6px;border-radius:999px;vertical-align:2px}
.search-launch{flex:1;max-width:620px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:16px;padding:11px 14px;display:flex;align-items:center;gap:10px;text-align:left;transition:.2s}.search-launch:hover{border-color:#BAC2FF;background:var(--surface)}.search-launch .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kbd{font-size:10px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 6px;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.icon-btn,.shift-btn{height:42px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;display:grid;place-items:center;box-shadow:0 3px 10px rgba(41,54,112,.04)}.icon-btn{width:42px}.icon-btn.active{background:#F0EDFF;color:#6549D8;border-color:#D9D0FF}.shift-btn{padding:0 14px;display:flex;gap:8px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--indigo),var(--indigo2));border:0}.user-chip{display:flex;align-items:center;gap:9px;padding:5px 9px 5px 5px;border:1px solid var(--line);background:var(--surface);border-radius:15px}.avatar{width:32px;height:32px;border-radius:11px;background:linear-gradient(145deg,#FFD4D9,#C8B8FF);display:grid;place-items:center;font-size:13px;font-weight:900;color:#4D3C85}.user-chip strong{display:block;font-size:11px}.user-chip small{display:block;font-size:9px;color:var(--muted)}

.nav-wrap{position:sticky;top:72px;z-index:45;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 22px}.nav{display:flex;gap:4px;overflow:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.tab-btn{border:0;background:transparent;color:var(--muted);padding:12px 12px 10px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;white-space:nowrap}.tab-btn:hover{color:var(--ink)}.tab-btn.active{color:var(--indigo);border-bottom-color:var(--indigo)}.tab-btn .mini-ico{width:23px;height:23px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;color:currentColor}.tab-btn.active .mini-ico{background:#ECECFF}

.content{max-width:1520px;margin:0 auto;padding:26px}.page{display:none}.page.active{display:block}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.page-kicker{color:var(--indigo);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.page-head h1{font-size:30px;line-height:1.1;margin:5px 0 5px}.page-head p{margin:0;color:var(--muted);max-width:720px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;background:linear-gradient(135deg,var(--indigo),var(--indigo2));color:#fff;padding:10px 14px;border-radius:13px;font-weight:850;box-shadow:0 7px 16px rgba(91,99,230,.18)}.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none}.btn.danger{background:linear-gradient(135deg,#E85D6A,#C84452)}.btn.small{padding:8px 10px;font-size:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow2)}

/* Dashboard: deliberately different from SBAR home — asymmetrical bento / clinical cockpit */
.dash-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;min-height:330px;margin-bottom:18px}.hero-copy{position:relative;padding:34px;overflow:hidden;background:linear-gradient(135deg,#F0F1FF 0%,#F7F2FF 55%,#FFF4F5 100%);border:1px solid #E5DFFF;border-radius:30px}.dark .hero-copy{background:linear-gradient(135deg,#202742,#27223C 55%,#30212C);border-color:#39334F}.hero-copy:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-55px;top:-80px;border:30px solid rgba(91,99,230,.08)}.hero-copy:after{content:"";position:absolute;width:120px;height:120px;border-radius:28px;transform:rotate(26deg);left:-52px;bottom:-42px;background:rgba(255,125,140,.09)}.hero-copy .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;background:#fff;border:1px solid #E6E0FF;color:#5E55C9;font-size:11px;font-weight:900;position:relative;z-index:1}.dark .hero-copy .eyebrow{background:#1A2031;border-color:#3A405C;color:#C9C4FF}.hero-copy h1{font-size:42px;line-height:1.02;letter-spacing:-1.5px;margin:18px 0 12px;max-width:660px;position:relative;z-index:1}.hero-copy h1 span{color:var(--indigo)}.hero-copy p{max-width:610px;color:var(--muted);font-size:15px;line-height:1.65;position:relative;z-index:1}.hero-cta{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px;position:relative;z-index:1}.hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;position:relative;z-index:1}.hero-tags span{font-size:10px;font-weight:850;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.74);border:1px solid rgba(223,219,246,.9);color:#616E81}.dark .hero-tags span{background:#1A2031;border-color:#343D52;color:#AFC0D1}
.hero-visual{position:relative;overflow:hidden;border-radius:30px;background:#DCEAF0;border:1px solid var(--line);box-shadow:var(--shadow)}.hero-visual img{width:100%;height:100%;object-fit:cover;display:block}.hero-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(26,33,67,.42))}.visual-caption{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:11px 13px;display:flex;align-items:center;gap:10px;color:#26324A}.visual-caption .cap-icon{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--indigo),var(--lav));color:#fff;display:grid;place-items:center}.visual-caption strong{display:block;font-size:12px}.visual-caption small{display:block;color:#697587;font-size:10px;margin-top:2px}

.focus-ribbon{display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow2)}.focus-title{padding:17px 18px;background:linear-gradient(135deg,#EEF0FF,#F7F3FF);display:flex;align-items:center;gap:11px}.dark .focus-title{background:linear-gradient(135deg,#1D2440,#26223B)}.focus-title .pulse{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--indigo),var(--lav));color:#fff;display:grid;place-items:center}.focus-title strong{display:block;font-size:13px}.focus-title small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.focus-metric{padding:16px 18px;border-left:1px solid var(--line)}.focus-metric small{display:block;color:var(--muted);font-size:10px;font-weight:800}.focus-metric strong{display:block;font-size:23px;margin-top:4px}.focus-metric em{font-size:10px;font-style:normal;color:var(--muted)}
.bento{display:grid;grid-template-columns:1.15fr .85fr .85fr;gap:14px}.bento-card{padding:18px;min-height:190px}.bento-card h3{margin:0;font-size:15px}.bento-card .sub{color:var(--muted);font-size:11px;margin-top:4px}.patient-board{grid-row:span 2}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.section-link{border:0;background:transparent;color:var(--indigo);font-size:11px;font-weight:900}.patient-stack{display:grid;gap:10px}.patient-tile{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:16px;background:var(--surface2);transition:.18s}.patient-tile:hover{transform:translateY(-1px);border-color:#C9C6FF}.room-gem{height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#E8EAFF,#E7F3FF);color:#515BCC;font-weight:900;font-size:12px}.dark .room-gem{background:#263252;color:#B8C0FF}.pt-main strong{font-size:12px;display:block}.pt-main small{font-size:10px;color:var(--muted);display:block;margin-top:3px}.acuity{font-size:9px;font-weight:900;border-radius:999px;padding:5px 7px}.acuity.high{background:#FFE7EA;color:#C94B58}.acuity.med{background:#FFF1D9;color:#A97113}.acuity.low{background:#E5F7F0;color:#258563}.task-list,.med-list,.lab-list{display:grid;gap:8px}.micro-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.micro-row:last-child{border-bottom:0}.micro-dot{width:10px;height:10px;border-radius:50%;background:var(--indigo)}.micro-copy strong{display:block;font-size:11px}.micro-copy small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.micro-time{font-size:9px;color:var(--muted);font-weight:850}.mini-progress{height:7px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:12px}.mini-progress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--indigo),var(--lav))}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick-card{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:17px;padding:13px;text-align:left;min-height:88px;transition:.17s}.quick-card:hover{transform:translateY(-2px);border-color:#C9C6FF}.quick-card .qicon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;margin-bottom:9px}.quick-card strong{display:block;font-size:11px}.quick-card small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.q-purple{background:#EEE9FF;color:#6C55CF}.q-sky{background:#E5F5FF;color:#347CB1}.q-coral{background:#FFE8EB;color:#C55462}.q-mint{background:#E1F7EF;color:#2B866B}

.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.section-card{padding:18px}.section-card h3{margin:0 0 4px}.section-card p{margin:0;color:var(--muted);font-size:12px}.stat-card{padding:17px;position:relative;overflow:hidden}.stat-card:before{content:"";position:absolute;width:68px;height:68px;border-radius:24px;right:-17px;top:-19px;background:color-mix(in srgb,var(--accent) 10%,transparent);transform:rotate(20deg)}.stat-card small{color:var(--muted);font-weight:800}.stat-card strong{display:block;font-size:27px;margin:8px 0 2px}.stat-card em{font-style:normal;font-size:10px;color:var(--muted)}

.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}table{width:100%;border-collapse:collapse}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface2)}tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900;background:var(--surface2);border:1px solid var(--line)}.badge.success{background:#E7F7F0;color:#2B8A68;border-color:#CDEDE0}.badge.warn{background:#FFF4DF;color:#A77118;border-color:#F3DFC0}.badge.danger{background:#FFE8EA;color:#C94B58;border-color:#F5CCD1}.dark .badge.success{background:#17392F;color:#7BD3AD;border-color:#2A5A4A}.dark .badge.warn{background:#3A301E;color:#E8C56F;border-color:#5E4E2B}.dark .badge.danger{background:#40252B;color:#F0A1AA;border-color:#653A43}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:900}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#A9AEFF;box-shadow:0 0 0 3px rgba(91,99,230,.1)}.field textarea{min-height:108px;resize:vertical}.select-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.patient-selector{min-width:210px}.list{display:grid;gap:9px}.list-item{padding:11px 12px;border:1px solid var(--line);background:var(--surface2);border-radius:14px;display:flex;gap:11px;align-items:flex-start}.list-item .dot{width:10px;height:10px;border-radius:50%;background:var(--indigo);margin-top:4px;flex:none}.list-item strong{display:block;font-size:11px}.list-item small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.grow{flex:1}.progress{height:9px;background:var(--surface2);border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--lav));border-radius:999px}

.assessment-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.assessment-box{padding:15px}.assessment-box h3{font-size:13px;margin:0 0 10px}.check-row{display:flex;gap:8px;align-items:center;margin:7px 0;font-size:11px;color:var(--muted)}.check-row input{accent-color:var(--indigo)}
.timeline{display:grid;gap:9px}.timeline-row{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:start}.timeline-time{font-weight:900;color:var(--indigo);padding-top:10px}.timeline-slot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-height:46px}.handoff-shell{max-width:1000px;margin:auto}.handoff-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.handoff-block{padding:16px;background:var(--surface2);border:1px solid var(--line);border-radius:16px}.handoff-block h3{margin:0 0 8px;font-size:12px;color:var(--indigo)}
.practice-hero{padding:24px;background:linear-gradient(135deg,#F0F1FF,#FFF2F4);border:1px solid #E6DEFF;border-radius:24px}.dark .practice-hero{background:linear-gradient(135deg,#202742,#30212C);border-color:#3A405C}.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.case-card{padding:16px;cursor:pointer;transition:.18s}.case-card:hover{transform:translateY(-2px);border-color:#C6C3FF}.case-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#ECEBFF;color:#5D61D8;margin-bottom:10px}
.saved-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.saved-card{padding:17px;position:relative}.saved-card .date{font-size:10px;color:var(--muted);font-weight:850}.saved-card h3{margin:5px 0 3px}.saved-card p{color:var(--muted);font-size:10px;margin:0}.saved-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.toggle-row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.toggle-row:last-child{border-bottom:0}.toggle-row strong{display:block;font-size:12px}.toggle-row small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.switch{width:48px;height:26px;border-radius:999px;background:#BBC4D4;position:relative;transition:.2s;flex:none}.switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.12);transition:.2s}.switch.on{background:var(--indigo)}.switch.on:after{left:25px}

.modal-backdrop,.search-overlay{position:fixed;inset:0;z-index:100;background:rgba(15,20,35,.58);display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show,.search-overlay.show{display:flex}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0}.modal-close{border:0;background:transparent;color:var(--muted);font-size:24px}.modal-body{padding:20px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}.search-panel{width:min(760px,100%);max-height:80vh;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.28);overflow:hidden}.search-input-row{display:flex;align-items:center;gap:10px;padding:15px;border-bottom:1px solid var(--line)}.search-input-row input{flex:1;border:0;background:transparent;outline:none;color:var(--ink);font-size:16px}.search-results{max-height:58vh;overflow:auto;padding:10px}.search-result{padding:12px;border-radius:14px;display:flex;gap:11px;align-items:center;cursor:pointer}.search-result:hover{background:var(--surface2)}.search-result .sr-icon{width:34px;height:34px;border-radius:10px;background:#ECECFF;color:var(--indigo);display:grid;place-items:center;flex:none}.search-result strong{display:block;font-size:12px}.search-result small{display:block;font-size:9px;color:var(--muted);margin-top:3px}.search-empty{padding:32px;text-align:center;color:var(--muted)}
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:140;display:grid;gap:8px}.toast{background:#242B45;color:#fff;padding:11px 14px;border-radius:13px;box-shadow:0 12px 32px rgba(0,0,0,.2);font-size:12px;animation:toastIn .2s ease}@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.privacy-on .private,body.privacy-on .patient-tile .pt-main strong,body.privacy-on .patient-tile .pt-main small,body.privacy-on table tbody td[data-private],body.privacy-on input[data-private],body.privacy-on textarea[data-private]{filter:blur(5px);user-select:none}body.privacy-on input[data-private]:focus,body.privacy-on textarea[data-private]:focus{filter:none}
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle}.icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

function normalizeState(){
 state.shifts=Array.isArray(state.shifts)?state.shifts:[makeShift('s1','New Shift',true)];
 if(!state.shifts.length)state.shifts=[makeShift('s1','New Shift',true)];
 if(!state.currentShiftId||!state.shifts.some(s=>s.id===state.currentShiftId))state.currentShiftId=state.shifts[0].id;
 const s=shift();
 if(!state.currentPatientId||!s.patients.some(p=>p.id===state.currentPatientId))state.currentPatientId=s.patients[0]?.id||null;
 state.profile=state.profile||{name:'Nurse',unit:'Med-Surg Unit'};
 state.practiceDone=state.practiceDone||[];
 state.assessmentSystems=Array.isArray(state.assessmentSystems)&&state.assessmentSystems.length?state.assessmentSystems:[...DEFAULT_ASSESSMENT_SYSTEMS];
 state.endShiftChecklist=Array.isArray(state.endShiftChecklist)&&state.endShiftChecklist.length

 state.shifts.forEach(sh=>{

function fnv32(value){let h=0x811c9dc5;const s=String(value||'');for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
function codeHash(value){const s=String(value||'').trim().toUpperCase();return fnv32(s)+fnv32([...s].reverse().join(''))}

function syncActiveTab(page){
 const nav=document.getElementById('nav'),active=document.getElementById('nav-'+page);
 if(!nav||!active)return;
 document.querySelectorAll('.tab-btn').forEach(b=>b.setAttribute('aria-selected',b===active?'true':'false'));
 const move=()=>{
  const max=Math.max(0,nav.scrollWidth-nav.clientWidth);
  const wanted=active.offsetLeft-(nav.clientWidth-active.offsetWidth)/2;
  const left=Math.max(0,Math.min(max,wanted));
  try{if(typeof nav.scrollTo==='function')nav.scrollTo({left,behavior:'smooth'});else nav.scrollLeft=left}catch(e){nav.scrollLeft=left}
 };
 requestAnimationFrame(move);setTimeout(move,80);
}

 target.classList.add('active');
 document.getElementById('nav-'+p)?.classList.add('active');
 const fn=renderers[p];if(fn)fn();
 syncActiveTab(p);
 clearPageSearchMarks();
 if(highlight)setTimeout(()=>highlightPageMatches(highlight),70);
 if(history&&!handlingHistory){
  try{
   const st=historyStatePage();
   if(st!==p)window.history.pushState({medsurg:true,page:p},'');
  }catch(e){}
 }

}

 });
}

function renderSettings(){document.getElementById('page-settings').innerHTML=pageHead('Settings','Personalize the interface and review privacy options.')+`<div class="settings-grid"><div class="card section-card"><h3>Appearance & Privacy</h3><div class="toggle-row"><div><strong>Dark Mode</strong><small>Switch the full interface to the dark palette.</small></div><div class="switch ${state.theme==='dark'?'on':''}" onclick="toggleTheme()"></div></div><div class="toggle-row"><div><strong>Privacy Mode</strong><small>Mask patient-related fields until you choose to reveal them.</small></div><div class="switch ${state.privacy?'on':''}" onclick="togglePrivacy()"></div></div></div><div class="card section-card"><h3>Profile Label</h3><div class="form-grid" style="margin-top:12px"><div class="field full"><label>Display name</label><input value="${esc(state.profile.name)}" onchange="state.profile.name=this.value;save()"></div><div class="field full"><label>Unit label</label><input value="${esc(state.profile.unit)}" onchange="state.profile.unit=this.value;save()"></div></div></div><div class="card section-card"><h3>Data Reset</h3><p>Return the app to the built-in preview data. Download a backup first if you want to keep your work.</p><div class="actions" style="margin-top:14px"><button class="btn danger" onclick="resetDemo()">Reset Preview Data</button></div></div><div class="card section-card"><h3>About</h3><p><strong>Med-Surg Nursing App</strong><br>By Plalinda Studio</p><p style="margin-top:10px">Designed as a local organizational workspace for Med-Surg nursing workflows.</p></div></div>`}
function resetDemo(){showConfirmModal('Reset Preview Data','Reset all local app data and return to the built-in preview version? Download a backup first if you want to keep your current work.','Reset Preview Data',commitResetDemo,'danger')}
function commitResetDemo(){localStorage.removeItem(STORAGE);closeModal();location.reload()}

let __overlayScrollY=0;
function lockBackgroundScroll(){
 if(document.documentElement.classList.contains('overlay-lock'))return;
 __overlayScrollY=window.scrollY||window.pageYOffset||0;
 document.documentElement.classList.add('overlay-lock');document.body.classList.add('overlay-lock');
}
function unlockBackgroundScroll(){
 document.documentElement.classList.remove('overlay-lock');document.body.classList.remove('overlay-lock');
 requestAnimationFrame(()=>window.scrollTo(0,__overlayScrollY||0));
}
function pushOverlayHistory(type){try{if(window.history.state?.medsurgOverlay===type)return;window.history.pushState({medsurg:true,page:currentPage,medsurgOverlay:type},'')}catch(e){}}
function showModal(title,body,foot=''){document.getElementById('modal').innerHTML=`<div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;document.getElementById('modalBackdrop').classList.add('show');lockBackgroundScroll();pushOverlayHistory('modal')}
function hideModalOnly(){document.getElementById('modalBackdrop').classList.remove('show');window.__confirmAction=null;unlockBackgroundScroll()}
function closeModal(){if(window.history.state?.medsurgOverlay==='modal'){try{window.history.back();return}catch(e){}}hideModalOnly()}
let activeSearchQuery='';
function openSearch(){
 document.getElementById('searchOverlay').classList.add('show');
 lockBackgroundScroll();
 pushOverlayHistory('search');
 const i=document.getElementById('globalSearch');i.value='';activeSearchQuery='';renderSearch('');setTimeout(()=>i.focus(),40);
}
function hideSearchOnly(){document.getElementById('searchOverlay').classList.remove('show');activeSearchQuery='';unlockBackgroundScroll()}
function closeSearch(){
 if(window.history.state?.medsurgOverlay==='search'){try{window.history.back();return}catch(e){}}
 hideSearchOnly();
}
function highlight(text,q){
 const s=String(text??''),needle=String(q??'').trim();if(!needle)return esc(s);
 const lower=s.toLowerCase(),n=needle.toLowerCase();let pos=0,out='',i;
 while((i=lower.indexOf(n,pos))>=0){out+=esc(s.slice(pos,i))+'<mark>'+esc(s.slice(i,i+needle.length))+'</mark>';pos=i+needle.length}
 return out+esc(s.slice(pos));
}
function searchData(q){
 const z=String(q||'').trim().toLowerCase(),items=[];if(!z)return items;
 const add=(page,pid,title,sub,ic)=>items.push({page,pid,title:String(title||''),sub:String(sub||''),ic});
 for(const p of shift().patients){
  const searchablePatient=[p.alias,p.room,p.dx,p.assessment,p.care,p.notes,p.diagnosticNotes,Object.values(p.assessmentNotes||{}).join(' '),...(p.vitals||[]).flat()];
  if(searchablePatient.some(v=>String(v||'').toLowerCase().includes(z)))add('patients',p.id,`${p.room} · ${p.alias}`,`${p.dx} · patient / assessment / vitals / notes`,'users');
  (p.meds||[]).forEach(m=>{if(m.join(' ').toLowerCase().includes(z))add('medications',p.id,m[1],`${p.room} · ${m[0]} · ${m[2]}`,'pill')});
  (p.labs||[]).forEach(l=>{if(l.join(' ').toLowerCase().includes(z))add('labs',p.id,l[0],`${p.room} · ${l[1]}`,'flask')});
  (p.tasks||[]).forEach(t=>{if(t.join(' ').toLowerCase().includes(z))add('tasks',p.id,t[0],`${p.room} · ${t[2]||'No time'} · ${t[1]?'Completed':'Open'}`,'check')});
  if(String(p.care||'').toLowerCase().includes(z))add('careplans',p.id,'Care Plan',`${p.room} · ${p.alias}`,'heart');
  if(String(p.notes||'').toLowerCase().includes(z))add('notes',p.id,'Patient Notes',`${p.room} · ${p.alias}`,'note');
  Object.entries(p.assessmentNotes||{}).forEach(([system,note])=>{if((system+' '+note).toLowerCase().includes(z))add('assessment',p.id,system,`${p.room} · ${p.alias}`,'stethoscope')});
  (p.vitals||[]).forEach(v=>{if(v.join(' ').toLowerCase().includes(z))add('vitals',p.id,'Vital Signs',`${p.room} · ${v.join(' · ')}`,'activity')});
 }
 const s=shift();
 if(String(s.generalNotes||'').toLowerCase().includes(z))add('notes','', 'General Shift Notes',String(s.generalNotes||'').slice(0,120),'note');
 (s.timeline||[]).forEach(t=>{if(t.join(' ').toLowerCase().includes(z))add('timeline','',t[1],t[0],'clock')});
 (state.endShiftChecklist||[]).forEach(item=>{if(String(item.label||'').toLowerCase().includes(z))add('practice','',item.label,'End-of-Shift Checklist','check')});
 return items;
}
function renderSearch(q){
 activeSearchQuery=q;
 const out=document.getElementById('searchResults'),z=q.trim();
 if(!z){out.innerHTML='<div class="search-empty"><strong>Search the whole shift</strong><br>Start typing one letter. Matching text will be highlighted across patients, assessments, vitals, medications, labs, tasks, care plans, timeline, and notes.</div>';return}
 const items=searchData(z);
 out.innerHTML=items.length?items.slice(0,40).map(x=>`<div class="search-result" tabindex="0" data-page="${x.page}" data-pid="${x.pid||''}"><div class="sr-icon">${icon(x.ic,16)}</div><div><strong>${highlight(x.title,z)}</strong><small>${highlight(x.sub,z)}</small></div></div>`).join(''):'<div class="search-empty"><strong>No matches found.</strong><br>Try another letter, word, room, medication, lab, task, or note.</div>';
 out.querySelectorAll('.search-result').forEach(row=>{const go=()=>searchGo(row.dataset.page,row.dataset.pid,z);row.onclick=go;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
}
function clearPageSearchMarks(){document.querySelectorAll('.page-search-mark').forEach(mark=>mark.replaceWith(document.createTextNode(mark.textContent||'')))}
function highlightPageMatches(q){
 clearPageSearchMarks();const needle=String(q||'').trim();if(!needle)return;
 const root=document.querySelector('.page.active');if(!root)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
  const parent=node.parentElement;if(!parent)return NodeFilter.FILTER_REJECT;
  if(parent.closest('script,style,input,textarea,select,button,.page-search-mark'))return NodeFilter.FILTER_REJECT;
  return String(node.nodeValue||'').toLowerCase().includes(needle.toLowerCase())?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
 }});
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(node=>{
  const text=node.nodeValue,lower=text.toLowerCase(),n=needle.toLowerCase();let pos=0,i,frag=document.createDocumentFragment();
  while((i=lower.indexOf(n,pos))>=0){frag.append(text.slice(pos,i));const mark=document.createElement('mark');mark.className='page-search-mark';mark.textContent=text.slice(i,i+needle.length);frag.append(mark);pos=i+needle.length}
  frag.append(text.slice(pos));node.replaceWith(frag);
 });
 const first=root.querySelector('.page-search-mark');first?.scrollIntoView({behavior:'smooth',block:'center'});
}
function searchGo(page,pid,q=activeSearchQuery){
 if(pid){state.currentPatientId=pid;save()}
 hideSearchOnly();
 if(window.history.state?.medsurgOverlay==='search'){try{window.history.back()}catch(e){}}
 setTimeout(()=>navigate(page,{history:true,highlight:q}),30);
}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save();applyTheme();renderCurrent();toast(state.theme==='dark'?'Dark mode on':'Light mode on')}
function togglePrivacy(){state.privacy=!state.privacy;save();applyTheme();renderCurrent();toast(state.privacy?'Privacy mode on':'Privacy mode off')}
function applyTheme(){document.body.classList.toggle('dark',state.theme==='dark');document.body.classList.toggle('privacy-on',!!state.privacy);updateTopUI()}
function isPhoneLayout(){return window.matchMedia('(max-width:720px)').matches}
function updateResponsiveTopbar(){
 const primary=document.getElementById('topPrimaryAction');
 const plus=document.getElementById('plusIcon');
 const mobileSettings=document.getElementById('mobileSettingsIcon');
 if(plus)plus.innerHTML=icon('plus',16);
 if(primary){primary.title='New Shift';primary.setAttribute('aria-label','Create New Shift')}
 if(mobileSettings)mobileSettings.innerHTML=icon('settings',13);
}
function updateTopUI(){
 document.getElementById('profileName').textContent=state.profile?.name||'Nurse';

 document.getElementById('privacyBtn').innerHTML=icon(state.privacy?'eyeoff':'eye',18);

 updateResponsiveTopbar();
}
function renderAll(){Object.values(renderers).forEach(fn=>{try{fn()}catch(e){console.error(e)}})}
const renderers={dashboard:renderDashboard,patients:renderPatients,assessment:renderAssessment,vitals:renderVitals,medications:renderMeds,labs:renderLabs,tasks:renderTasks,careplans:renderCarePlans,timeline:renderTimeline,handoff:renderHandoff,notes:renderNotes,practice:renderPractice,saved:renderSaved,backup:renderBackup,help:renderHelp,settings:renderSettings};

window.addEventListener('resize',()=>{updateResponsiveTopbar();syncActiveTab(currentPage)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){if(document.getElementById('searchOverlay').classList.contains('show'))closeSearch();else if(document.getElementById('modalBackdrop').classList.contains('show'))closeModal()}});
renderNav();applyTheme();renderAll();initHistory();navigate('dashboard',{history:false});
</script>
